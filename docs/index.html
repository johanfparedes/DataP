<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DataP</title>
  <meta name="description" content="DataP: tu espacio para organizar proyectos, tareas, calendario, notas, hábitos, enfoque y análisis de datos.">
  <meta name="theme-color" content="#2a78d6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DataP">
  <script>
    // Aplica el tema guardado antes de pintar para evitar parpadeos.
    (function () {
      try {
        var t = localStorage.getItem('datap-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <a class="skip-link" href="#view">Saltar al contenido</a>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
      <a class="brand" href="#/inicio">
        <span class="brand-mark" data-icon="scatter"></span>
        <span class="brand-text">
          <span class="brand-name">DataP</span>
          <span class="brand-tag">Tu espacio de organización</span>
        </span>
      </a>

      <button type="button" class="search-btn" data-action="search">
        <span data-icon="search"></span><span>Buscar o crear…</span><kbd class="kbd" data-kbd-mod>Ctrl K</kbd>
      </button>

      <a class="focus-pill" href="#/enfoque" data-focus-pill hidden><span data-icon="timer"></span><span class="fp-label">Enfoque</span><span class="fp-time" data-focus-time>25:00</span></a>

      <nav class="nav" id="nav"></nav>

      <div class="sidebar-footer">
        <a class="nav-link" href="#/ajustes" data-route="ajustes"><span data-icon="settings"></span><span class="nav-text">Ajustes</span></a>
        <button type="button" class="icon-btn" id="theme-toggle"></button>
        <a class="icon-btn" id="repo-link" href="#" target="_blank" rel="noopener" aria-label="Repositorio en GitHub" title="Repositorio en GitHub"><span data-icon="code"></span></a>
      </div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="topbar">
        <button type="button" class="icon-btn" id="menu-btn" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menú">
          <span data-icon="menu"></span>
        </button>
        <a class="brand" href="#/inicio">
          <span class="brand-mark" data-icon="scatter"></span>
          <span class="brand-text"><span class="brand-name">DataP</span></span>
        </a>
        <span class="spacer"></span>
        <a class="focus-pill is-compact" href="#/enfoque" data-focus-pill hidden><span data-icon="timer"></span><span class="fp-time" data-focus-time>25:00</span></a>
        <button type="button" class="icon-btn" data-action="search" aria-label="Buscar"><span data-icon="search"></span></button>
        <button type="button" class="icon-btn" data-action="new-task" aria-label="Nueva tarea"><span data-icon="plus"></span></button>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <noscript>
    <p style="padding:24px">Esta web necesita JavaScript para funcionar.</p>
  </noscript>

  <!-- Núcleo -->
  <script src="assets/js/app.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/focus.js"></script>

  <!-- Librerías propias (sin dependencias externas) -->
  <script src="assets/js/lib/pca.js"></script>
  <script src="assets/js/lib/file-reader.js"></script>
  <script src="assets/js/lib/charts.js"></script>

  <!-- Datos de los proyectos -->
  <script src="assets/data/pca-clientes.js"></script>

  <!-- Módulos (cada uno se registra solo en el menú) -->
  <script src="assets/js/modules/inicio.js"></script>
  <script src="assets/js/modules/tareas.js"></script>
  <script src="assets/js/modules/calendario.js"></script>
  <script src="assets/js/modules/notas.js"></script>
  <script src="assets/js/modules/habitos.js"></script>
  <script src="assets/js/modules/enfoque.js"></script>
  <script src="assets/js/modules/proyectos.js"></script>
  <script src="assets/js/modules/analisis-pca.js"></script>
  <script src="assets/js/modules/laboratorio.js"></script>
  <script src="assets/js/modules/ajustes.js"></script>
</body>
</html>
